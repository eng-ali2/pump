<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مراقبة مضخات وحدة الأسفلت</title>
  <meta name="theme-color" content="#15213c">
  <meta name="description" content="مصفى ذي قار— تسجيل قراءات المضخات والصيانة والأعطال مع لوحة تحكم">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مضخات الأسفلت">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="modulepreload" href="store.js">
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js" crossorigin>
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js" crossorigin>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#">
        <img src="icons/logo.png" alt="شعار مصفى ذي قار">
        <span class="brand-t"><b id="appName"></b><small id="coName"></small></span>
      </a>
      <div class="who">
        <button class="icon-btn bell" id="bellBtn" title="التنبيهات" aria-label="التنبيهات" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 002.45-2h-4.9A2.5 2.5 0 0012 22zm7-6V11a7 7 0 00-5.5-6.84V3.5a1.5 1.5 0 00-3 0v.66A7 7 0 005 11v5l-2 2v1h18v-1z"/></svg>
          <span class="badge" id="bellCount" hidden>0</span>
        </button>
        <span class="avatar" id="avatar"></span>
        <span class="who-t"><b id="whoName"></b><small id="whoRole"></small></span>
        <button class="icon-btn" id="pwBtn" title="تغيير كلمة المرور" aria-label="تغيير كلمة المرور">
          <svg viewBox="0 0 24 24"><path d="M12.65 10A6 6 0 107 16a6 6 0 005.65-4H17v4h4v-4h2v-2zM7 14a2 2 0 110-4 2 2 0 010 4z"/></svg>
        </button>
        <button class="icon-btn" id="logoutBtn" title="تسجيل الخروج" aria-label="تسجيل الخروج">
          <svg viewBox="0 0 24 24"><path d="M10 17l1.4-1.4L8.8 13H20v-2H8.8l2.6-2.6L10 7l-5 5zM4 5h8V3H4a2 2 0 00-2 2v14c0 1.1.9 2 2 2h8v-2H4z"/></svg>
        </button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="bell-panel" id="bellPanel"></div>
  </header>
  <div class="demo-bar" id="demoBar" hidden>وضع تجريبي: البيانات محفوظة على هذا الجهاز فقط</div>
  <main id="view"><div class="loading">جاري التحميل…</div></main>
  <footer class="credit">تصميم وبرمجة المهندس <b>علي جابر</b></footer>
  <nav class="bnav" id="bnav"></nav>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
